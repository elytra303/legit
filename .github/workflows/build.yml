name: build

on:
  push:
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v143

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: summer_client
          path: build/Release/summer_client.dll

  mingw:
    name: MinGW x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install MinGW
        run: choco install mingw -y --no-progress

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build
